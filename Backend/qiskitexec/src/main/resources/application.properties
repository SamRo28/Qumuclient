proxy.url=https://alarcosj.esi.uclm.es/proxyaotro/proxyaotro/resend
remote.runner.url=http://172.20.48.130:8081/run_code

# El proxy solo hace falta para llegar al runner desde fuera de la red de la UCLM,
# porque remote.runner.url es una IP privada. Dentro de la facultad o por VPN se
# puede ir directo, y asi se evita el 504 de nginx cuando un lote tarda mas que su
# proxy_read_timeout (60s por defecto) aunque el runner siguiera trabajando.
proxy.enabled=false

# async = /run_code_async (pool caliente, paralelo, sin timeouts de proxy); sync = /run_code
execution.mode=async
execution.poll.max-interval-ms=2000

# ≈ 4-8 × W del runner; en async no provoca timeouts, el runner limita la concurrencia a W
execution.batch.size=64

# segundos máximos SIN progreso (ningún programa terminado) antes de abandonar y cancelar el lote del runner
execution.timeout.seconds=900
# tope absoluto por lote; debe ser menor que app.qiskitexec.read-timeout-seconds de reper (3600)
execution.timeout.max-total-seconds=3000

# Trabajos asíncronos (/strategy/jobs): reper envía, sondea y recoge; ninguna petición atraviesa nginx durante minutos
jobs.max-concurrent=4
# si nadie consulta el estado de un trabajo en este tiempo (p. ej. reper reiniciado), se cancela y se libera el runner
jobs.orphan-timeout-seconds=120
# resultados no recogidos se descartan pasado este tiempo
jobs.result-ttl-seconds=3600
