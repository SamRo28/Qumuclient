proxy.url=https://alarcosj.esi.uclm.es/proxyaotro/proxyaotro/resend
remote.runner.url=http://172.20.48.130:8081/run_code

# El proxy solo hace falta para llegar al runner desde fuera de la red de la UCLM,
# porque remote.runner.url es una IP privada. Dentro de la facultad o por VPN se
# puede ir directo, y asi se evita el 504 de nginx cuando un lote tarda mas que su
# proxy_read_timeout (60s por defecto) aunque el runner siguiera trabajando.
proxy.enabled=false

# Numero de programas por peticion. El runner los paraleliza, pero un lote grande
# de circuitos pesados haria una peticion larguisima y de todo-o-nada.
execution.batch.size=16

# Segundos que esperamos al runner antes de rendirnos. Sin esto RestTemplate
# esperaria indefinidamente.
execution.timeout.seconds=600
