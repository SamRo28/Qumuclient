<div class="chat-modal-container" [style.width.px]="width" [style.height.px]="height" [style.top.px]="top"
    [style.left.px]="left">

    <!-- Header (Draggable) -->
    <div class="modal-header" (mousedown)="startDragging($event)">
        <h3>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="ai-icon">
                <path
                    d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                </path>
            </svg>
            AI Assistant
        </h3>
        <button class="close-btn" (click)="onClose()" (mousedown)="$event.stopPropagation()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <div class="modal-content">
        <!-- Chat History -->
        <div class="chat-history">
            <div *ngFor="let msg of chatHistory"
                [ngClass]="{'msg-user': msg.role === 'user', 'msg-assistant': msg.role === 'assistant'}">
                <div class="message-bubble" *ngIf="msg.role === 'user'">
                    {{ msg.content }}
                </div>
                <div class="message-bubble markdown-content" *ngIf="msg.role === 'assistant'"
                    [innerHTML]="msg.rendered">
                </div>
            </div>
            <div *ngIf="isSendingMessage" class="msg-assistant">
                <div class="message-bubble typing-indicator">
                    <span>.</span><span>.</span><span>.</span>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()"
                placeholder="Ask a follow-up question..." [disabled]="isSendingMessage">
            <button (click)="sendMessage()" [disabled]="!newMessage.trim() || isSendingMessage">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <!-- Resize Handle (Bottom Right) -->
    <div class="resize-handle-corner" (mousedown)="startResizing($event)">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="21 15 21 21 15 21"></polyline>
        </svg>
    </div>
</div>
