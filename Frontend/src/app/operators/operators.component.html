<div class="form-group">
  <label for="qubits">QUBITS</label>
  <input type="number" [(ngModel)]="qubitCount" class="form-control">
  <label>OUTPUT QUBITS</label>
  <div class="checkbox-group">
    <label *ngFor="let q of outputQubitsArray; index as i">
      <input type="checkbox" [(ngModel)]="manager.qubits[i]"> Qubit {{ i }}
    </label>
  </div>
</div>


<!-- Families dynamically loaded -->
<div *ngFor="let family of families" class="family-box">
  <label>
    {{ family.name }}
    <button (click)="showInfo(family)" class="info-button">i</button>
  </label>
  <div class="checkbox-group">
    <label *ngFor="let op of getEnabledOperators(family)">
      <input type="checkbox" [(ngModel)]="op.selected"> {{ op.name }}
    </label>
  </div>
</div>

<div class="form-actions">
  <button class="btn" (click)="selectAll()">Select All</button>
  <button class="btn btn-primary" (click)="generateMutants()">Generate Mutants</button>
</div>

<!-- Modal -->
<div *ngIf="isModalOpen" class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h5 class="modal-title">{{ selectedFamily?.name }} Operators</h5>
      <button type="button" class="close" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <ul>
        <li *ngFor="let op of getEnabledOperators(selectedFamily!)">
          <strong>{{ op.name }}:</strong> {{ op.description }}
        </li>
      </ul>
    </div>
  </div>
</div>
