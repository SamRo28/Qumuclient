<body>
    <div class="container">
        <!-- Original Code Section -->
        <div class="code-section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                    <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                ORIGINAL CIRCUIT
            </h2>
            <div class="circuit-iframe-container">
                <iframe *ngIf="originalCircuitUrl" [src]="originalCircuitUrl" class="circuit-iframe" frameborder="0"
                    title="Original QProgram Visualization">
                </iframe>
                <div *ngIf="!originalCircuitUrl" class="no-circuit-message">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" />
                        <path d="M3 9h18M9 3v18" stroke="currentColor" stroke-width="2" />
                    </svg>
                    <p>No circuit visualization available</p>
                </div>
            </div>
        </div>

        <!-- Mutant Code Section -->
        <div class="code-section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                MUTANT CIRCUIT
            </h2>
            <div class="circuit-iframe-container">
                <iframe *ngIf="mutantCircuitUrl" [src]="mutantCircuitUrl" class="circuit-iframe" frameborder="0"
                    title="Mutant QProgram Visualization">
                </iframe>
                <div *ngIf="!mutantCircuitUrl" class="no-circuit-message">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" />
                        <path d="M3 9h18M9 3v18" stroke="currentColor" stroke-width="2" />
                    </svg>
                    <p>No circuit visualization available</p>
                </div>
            </div>
        </div>
    </div>
</body>
