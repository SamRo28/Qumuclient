<div>

  <app-side-bar *ngIf="manager.showSidebar"></app-side-bar>

       [class.with-sidebar]="manager.showSidebar" 
       [class.sidebar-expanded]="manager.sidebarExpanded">
    <app-home *ngIf="manager.showHome"></app-home>
    
    <app-circuits-configuration *ngIf="manager.showCircuit"></app-circuits-configuration>

    <app-mutants-info *ngIf="manager.showMutantsInfo"></app-mutants-info>
    
    <app-mutant-cycle-info *ngIf="manager.showMutantCycleInfo" [mutantCycle]="manager.selectedMutantCycle"></app-mutant-cycle-info>

    <app-strategy-results *ngIf="manager.executionAlgorithm!='Simple'"></app-strategy-results>
