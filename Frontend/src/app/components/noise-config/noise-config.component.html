<div class="noise-config-container" *ngIf="config">
  <div class="noise-config-header">
    <span class="noise-config-title">Noise rotation</span>
  </div>

  <div class="noise-config-body">
    <!-- Axis selector -->
    <div class="control-row">
      <span class="control-label">Axis:</span>
      <div class="axis-buttons">
        <button
          *ngFor="let a of axes"
          type="button"
          class="axis-btn"
          [class.active]="config.axis === a"
          (click)="setAxis(a)">
          {{ a }}
        </button>
      </div>
    </div>

    <!-- Angle input & presets -->
    <div class="control-row">
      <span class="control-label">Angle:</span>
      <div class="input-with-suffix">
        <input
          type="number"
          [(ngModel)]="config.angle"
          min="0.001"
          max="6.2832"
          step="0.01"
          class="glass-input">
        <span class="input-suffix">rad</span>
      </div>
      <div class="preset-buttons">
        <button
          *ngFor="let p of presets"
          type="button"
          class="preset-btn"
          (click)="setPreset(p.value)">
          {{ p.label }}
        </button>
      </div>
    </div>

    <!-- Preview -->
    <div class="noise-preview">
      <span>Preview: </span>
      <code class="preview-badge">R{{ config.axis | lowercase }}({{ config.angle | number:'1.0-4' }} rad) ≈ {{ degrees | number:'1.0-2' }}°</code>
    </div>

    <!-- Validation error -->
    <div *ngIf="!valid" class="validation-error">
      Angle must be greater than 0 and at most 2π (≈ 6.2832) radians.
    </div>
  </div>
</div>
