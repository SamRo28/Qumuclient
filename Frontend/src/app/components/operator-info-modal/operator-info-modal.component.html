<div #windowEl class="info-window" role="dialog" aria-modal="false" [attr.aria-label]="family?.name + ' operators'"
     [style.width.px]="width" [style.height.px]="height" [style.top.px]="top" [style.left.px]="left">
  <div class="window-header" (mousedown)="startDragging($event)">
    <h3>
      <svg class="info-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      {{ family?.name }}
      <span class="window-subtitle">{{ operators.length }} operators</span>
    </h3>
    <button type="button" class="close-btn" (click)="close()" (mousedown)="$event.stopPropagation()" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  <div class="window-body">
    <p *ngIf="intro" class="window-intro">{{ intro }}</p>
    <div *ngFor="let op of operators" class="operator-info" [ngClass]="accentFor(op)">
      <span class="operator-kind-chip">{{ op.name | operatorLabel }}</span>
      <p class="operator-desc">{{ op.description }}</p>
    </div>
  </div>
  <div class="resize-handle-corner" (mousedown)="startResizing($event)">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="21 15 21 21 15 21"></polyline>
    </svg>
  </div>
</div>
