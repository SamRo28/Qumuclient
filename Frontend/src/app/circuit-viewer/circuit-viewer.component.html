<div class="circuit-viewer-wrapper">
  <!-- Interactive Navigation Toolbar -->
  <div class="navigation-toolbar glass-card">
    <button type="button" class="nav-btn" (click)="zoomIn()" title="Zoom In">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
    </button>
    <button type="button" class="nav-btn" (click)="zoomOut()" title="Zoom Out">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
    </button>
    <button type="button" class="nav-btn reset-btn" (click)="resetZoom()" title="Reset Zoom & Pan">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <polyline points="3 3 3 8 8 8"></polyline>
      </svg>
      <span>{{ zoomScale | percent }}</span>
    </button>
    <div class="drag-indicator" [class.active]="isDragging">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="5 9 2 12 5 15"></polyline>
        <polyline points="9 5 12 2 15 5"></polyline>
        <polyline points="15 19 12 22 9 19"></polyline>
        <polyline points="19 9 22 12 19 15"></polyline>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="12" y1="2" x2="12" y2="22"></line>
      </svg>
      <span>Drag canvas to navigate</span>
    </div>
  </div>

  <!-- Canvas Container -->
  <div 
    class="circuit-canvas-container"
    [class.grabbing]="isDragging"
    (mousedown)="onMouseDown($event)"
    (mousemove)="onMouseMove($event)"
    (mouseup)="onMouseUp()"
    (mouseleave)="onMouseUp()"
  >
    <div *ngIf="visualCols.length === 0" class="empty-circuit-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
        <line x1="15" y1="3" x2="15" y2="21"></line>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="3" y1="15" x2="21" y2="15"></line>
      </svg>
      <p>Empty circuit. Write some code to visualize it.</p>
    </div>

    <svg 
      *ngIf="visualCols.length > 0"
      [attr.width]="svgWidth * zoomScale" 
      [attr.height]="svgHeight * zoomScale" 
      [attr.viewBox]="'0 0 ' + svgWidth + ' ' + svgHeight"
      class="circuit-svg"
    >
      <g [attr.transform]="'translate(' + panX + ',' + panY + ') scale(' + zoomScale + ')'">
        
        <!-- 1. Oracle Boxes (Rendered first at the bottom layer) -->
        <g *ngFor="let box of oracleBoxes" class="oracle-box-group" [attr.data-depth]="box.depth">
          <!-- Bounding box. The top edge is extended UP by a header band (per nesting
               slot) so the title sits inside the dashed box, above the first-wire gates.
               Deeper oracles sharing the top edge get their own stacked band. -->
          <rect
            [attr.x]="paddingX + box.startCol * colWidth - colWidth / 2 + 4"
            [attr.y]="paddingY + box.startRow * wireSpacing - wireSpacing / 2 - (box.headerSlot + 1) * headerBand"
            [attr.width]="(box.endCol - box.startCol + 1) * colWidth - 8"
            [attr.height]="(box.endRow - box.startRow + 1) * wireSpacing + (box.headerSlot + 1) * headerBand"
            rx="8"
            ry="8"
            class="oracle-box-rect"
          />
          <!-- Title pill sits inside this box's own header band. -->
          <rect
            [attr.x]="paddingX + box.startCol * colWidth - colWidth / 2 + 12"
            [attr.y]="paddingY + box.startRow * wireSpacing - wireSpacing / 2 - (box.headerSlot + 1) * headerBand + 2"
            [attr.width]="box.name.length * 6.5 + 12"
            height="12"
            rx="4"
            ry="4"
            class="oracle-box-tag-rect"
          />
          <text
            [attr.x]="paddingX + box.startCol * colWidth - colWidth / 2 + 18"
            [attr.y]="paddingY + box.startRow * wireSpacing - wireSpacing / 2 - (box.headerSlot + 1) * headerBand + 11"
            class="oracle-box-title"
          >
            {{ box.name }}
          </text>
        </g>

        <!-- 2. Qubit Wires (Horizontal lines) -->
        <g class="qubit-wires">
          <g *ngFor="let wireIndex of [].constructor(numWires); let w = index" class="wire-group">
            <line 
              [attr.x1]="paddingX - 30"
              [attr.y1]="paddingY + w * wireSpacing"
              [attr.x2]="svgWidth - paddingX + 30"
              [attr.y2]="paddingY + w * wireSpacing"
              class="wire-line"
            />
            <text
              [attr.x]="paddingX - 60"
              [attr.y]="paddingY + w * wireSpacing + 4"
              class="wire-label"
              text-anchor="end"
            >
              q[{{ w }}]
            </text>
            <text
              [attr.x]="paddingX - 45"
              [attr.y]="paddingY + w * wireSpacing + 4"
              class="wire-init-state"
              [class.non-zero]="!isDefaultInit(w)"
              text-anchor="middle"
            >
              {{ getInitState(w) }}
            </text>
          </g>
        </g>

        <!-- 3. Vertical Connection Lines (For gates/controls in each column) -->
        <g class="column-lines">
          <ng-container *ngFor="let col of visualCols; let c = index">
            <line
              *ngFor="let coords of getVerticalLineCoords(c)"
              [attr.x1]="paddingX + c * colWidth"
              [attr.y1]="coords.y1"
              [attr.x2]="paddingX + c * colWidth"
              [attr.y2]="coords.y2"
              class="column-line"
            />
          </ng-container>
        </g>

        <!-- 4. Circuit Gates (Rendered on top) -->
        <g class="circuit-gates">
          <g *ngFor="let col of visualCols; let c = index">
            <g *ngFor="let cell of col; let w = index">
              
              <!-- Control Dot (•) -->
              <circle 
                *ngIf="cell.type === 'control'"
                [attr.cx]="paddingX + c * colWidth"
                [attr.cy]="paddingY + w * wireSpacing"
                r="6"
                class="gate-control"
                [class.mutated]="cell.isMutated"
                (mouseenter)="showTooltip($event, cell)"
                (mouseleave)="hideTooltip()"
              />

              <!-- Anti-control Dot (◦) -->
              <circle 
                *ngIf="cell.type === 'anti-control'"
                [attr.cx]="paddingX + c * colWidth"
                [attr.cy]="paddingY + w * wireSpacing"
                r="6"
                class="gate-anti-control"
                [class.mutated]="cell.isMutated"
                (mouseenter)="showTooltip($event, cell)"
                (mouseleave)="hideTooltip()"
              />

              <!-- Target Crosshair (⊕) -->
              <g 
                *ngIf="cell.type === 'target'"
                [attr.transform]="'translate(' + (paddingX + c * colWidth) + ', ' + (paddingY + w * wireSpacing) + ')'"
                class="gate-target-group"
                [class.mutated]="cell.isMutated"
                (mouseenter)="showTooltip($event, cell)"
                (mouseleave)="hideTooltip()"
              >
                <circle r="12" class="gate-target-circle" />
                <line x1="0" y1="-12" x2="0" y2="12" class="gate-target-line" />
                <line x1="-12" y1="0" x2="12" y2="0" class="gate-target-line" />
              </g>

              <!-- Swap cross (x) -->
              <g 
                *ngIf="cell.type === 'swap'"
                [attr.transform]="'translate(' + (paddingX + c * colWidth) + ', ' + (paddingY + w * wireSpacing) + ')'"
                class="gate-swap-group"
                [class.mutated]="cell.isMutated"
                (mouseenter)="showTooltip($event, cell)"
                (mouseleave)="hideTooltip()"
              >
                <line x1="-6" y1="-6" x2="6" y2="6" class="gate-swap-line" />
                <line x1="-6" y1="6" x2="6" y2="-6" class="gate-swap-line" />
              </g>

              <!-- Measurement Meter -->
              <g 
                *ngIf="cell.type === 'measure'"
                [attr.transform]="'translate(' + (paddingX + c * colWidth - gateSize / 2) + ', ' + (paddingY + w * wireSpacing - gateSize / 2) + ')'"
                class="gate-measure-group"
                [class.mutated]="cell.isMutated"
                (mouseenter)="showTooltip($event, cell)"
                (mouseleave)="hideTooltip()"
              >
                <rect [attr.width]="gateSize" [attr.height]="gateSize" rx="6" ry="6" class="gate-box" />
                <path d="M 6,28 A 13,13 0 0 1 32,28" fill="none" class="gate-measure-arc" />
                <line x1="19" y1="28" x2="27" y2="16" class="gate-measure-needle" />
              </g>

              <!-- Normal & Multi-wire Custom/Oracle Box -->
              <g 
                *ngIf="cell.type === 'gate'"
                class="gate-group"
                [class.mutated]="cell.isMutated"
                [class.multi-wire]="cell.gateHeight > 1"
                (mouseenter)="showTooltip($event, cell)"
                (mouseleave)="hideTooltip()"
              >
                <!-- Box covers wire height if spanning multiple qubits -->
                <rect 
                  [attr.x]="paddingX + c * colWidth - gateSize / 2"
                  [attr.y]="paddingY + w * wireSpacing - gateSize / 2"
                  [attr.width]="gateSize"
                  [attr.height]="gateSize + (cell.gateHeight - 1) * wireSpacing"
                  rx="6" 
                  ry="6"
                  class="gate-box"
                />
                <text 
                  [attr.x]="paddingX + c * colWidth"
                  [attr.y]="paddingY + w * wireSpacing + (cell.gateHeight - 1) * wireSpacing / 2 + 5"
                  class="gate-text"
                  text-anchor="middle"
                >
                  {{ cell.label }}
                </text>
              </g>

            </g>
          </g>
        </g>
        
      </g>
    </svg>

    <!-- Custom HTML Sleek Tooltip Overlay -->
    <div 
      *ngIf="hoveredCell" 
      class="circuit-tooltip"
      [style.left.px]="tooltipX" 
      [style.top.px]="tooltipY"
    >
      <div class="tooltip-arrow"></div>
      <div class="tooltip-content">
        <div class="tooltip-header">
          <span class="gate-badge" [class.mutated-badge]="hoveredCell.isMutated">
            {{ hoveredCell.isMutated ? 'Mutated' : 'Gate' }}
          </span>
          <span class="gate-coord">Col {{ hoveredCell.localColIndex }}, Row {{ hoveredCell.localRowIndex }}</span>
        </div>
        <div class="tooltip-body">
          {{ getGateDescription(hoveredCell) }}
        </div>
      </div>
    </div>
  </div>
</div>
