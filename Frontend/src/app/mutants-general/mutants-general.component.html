<div class="container">
  <h1>Mutant Information</h1>
  
  <div class="section">
    <div class="row">
      <div class="field">
        <label for="operator">OPERATOR</label>
        <input type="string" id="operator" name="operator" class="input" 
               [value]="selectedMutant?.operator?.name || selectedMutant?.mutationOperator" readonly>
      </div>
      
      <div class="field-small">
        <label for="column">COLUMN</label>
        <input type="number" id="column" name="column" min="-1" class="input" 
               [value]="selectedMutant?.mutatedColumn" readonly>
      </div>
      
      <div class="field-small">
        <label for="row">ROW</label>
        <input type="number" id="row" name="row" min="1" class="input" 
               [value]="selectedMutant?.mutatedRow" readonly>
      </div>
    </div>
  </div>
