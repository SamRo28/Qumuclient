<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with quantum grid -->
  <rect width="600" height="400" fill="#0a1929" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="white">Quantum Mutant Testing</text>
  <text x="300" y="65" font-family="Arial" font-size="14" text-anchor="middle" fill="#aaccff">Validating test case reliability through circuit mutations</text>

  <!-- Original Quantum QProgram -->
  <g transform="translate(100, 120)">
    <!-- QProgram wire -->
    <line x1="0" y1="0" x2="400" y2="0" stroke="#3f88f5" stroke-width="3" />
    
    <!-- Gates in original circuit -->
    <rect x="50" y="-20" width="40" height="40" fill="#3f88f5" stroke="#ffffff" stroke-width="1" />
    <text x="70" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">H</text>
    
    <rect x="150" y="-20" width="40" height="40" fill="#3f88f5" stroke="#ffffff" stroke-width="1" />
    <text x="170" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">X</text>
    
    <circle cx="250" cy="0" r="20" fill="#3f88f5" stroke="#ffffff" stroke-width="1" />
    <text x="250" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Z</text>
    
    <rect x="330" y="-20" width="40" height="40" fill="#3f88f5" stroke="#ffffff" stroke-width="1" />
    <text x="350" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">H</text>

    <!-- Pass indicator -->
    <circle cx="400" cy="0" r="18" fill="#4caf50" stroke="white" stroke-width="1" />
    <text x="400" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">✓</text>
  </g>


  <!-- Mutated Quantum QProgram -->
  <g transform="translate(100, 240)">
    <!-- QProgram wire -->
    <line x1="0" y1="0" x2="400" y2="0" stroke="#f558a4" stroke-width="3" />
    
    <!-- Gates in mutated circuit with one gate changed (mutation) -->
    <rect x="50" y="-20" width="40" height="40" fill="#f558a4" stroke="#ffffff" stroke-width="1" />
    <text x="70" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">H</text>
    
    <!-- This gate is different - representing the mutation -->
    <rect x="150" y="-20" width="40" height="40" fill="#ffcc00" stroke="#ffffff" stroke-width="2" />
    <text x="170" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Y</text>
    
    <circle cx="250" cy="0" r="20" fill="#f558a4" stroke="#ffffff" stroke-width="1" />
    <text x="250" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Z</text>
    
    <rect x="330" y="-20" width="40" height="40" fill="#f558a4" stroke="#ffffff" stroke-width="1" />
    <text x="350" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">H</text>

    <!-- Fail indicator -->
    <circle cx="400" cy="0" r="18" fill="#f44336" stroke="white" stroke-width="1" />
    <text x="400" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="white">✗</text>
  </g>
</svg>