<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: 'Inter', sans-serif;">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e293b" />
    </linearGradient>

    <!-- Glass Card Gradient (Dark) -->
    <linearGradient id="card-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" style="stop-color:rgba(15, 23, 42, 0.8)" />
    </linearGradient>
    
    <!-- Gate Gradient (Neon Greenish) -->
    <linearGradient id="gate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(16, 185, 129, 0.2)" />
      <stop offset="100%" style="stop-color:rgba(5, 150, 105, 0.3)" />
    </linearGradient>
    
    <!-- Warning Gradient (Neon Amber) -->
    <linearGradient id="warning-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(245, 158, 11, 0.2)" />
      <stop offset="100%" style="stop-color:rgba(217, 119, 6, 0.3)" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="wire-glow" x="-50%" y="-50%" width="200%" height="200%">
       <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#34d399"/>
    </filter>
  </defs>

  <!-- Main Background -->
  <rect width="600" height="400" fill="url(#bg-grad)" rx="24" />

  <!-- Subtle Grid Pattern -->
  <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600 M0 350 H600" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400 M400 0 V400 M450 0 V400 M500 0 V400 M550 0 V400" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Glass Card -->
  <rect x="20" y="20" width="560" height="360" rx="24" 
        fill="url(#card-bg-grad)" 
        stroke="rgba(52, 211, 153, 0.2)" 
        stroke-width="1" />
  
  <!-- Title -->
  <text x="300" y="70" font-size="24" font-weight="800" text-anchor="middle" fill="#f3f4f6" letter-spacing="-0.02em" style="filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.3));">Quantum Mutant Testing</text>
  <text x="300" y="95" font-size="14" text-anchor="middle" fill="#94a3b8">Validating test case reliability through circuit mutations</text>

  <!-- ORIGINAL SECTION -->
  <g transform="translate(100, 160)">
    <text x="-80" y="5" font-size="12" fill="#34d399" font-weight="700" letter-spacing="0.1em">ORIGINAL</text>

    <!-- Wire -->
    <line x1="0" y1="0" x2="380" y2="0" stroke="#34d399" stroke-width="2" opacity="0.5" />
    
    <!-- Gates -->
    <rect x="50" y="-20" width="40" height="40" rx="8" fill="url(#gate-grad)" stroke="#34d399" stroke-width="1.5" filter="url(#neon-glow)" />
    <text x="70" y="6" fill="#ecfdf5" font-size="16" font-weight="600" text-anchor="middle">H</text>
    
    <rect x="150" y="-20" width="40" height="40" rx="8" fill="url(#gate-grad)" stroke="#34d399" stroke-width="1.5" filter="url(#neon-glow)" />
    <text x="170" y="6" fill="#ecfdf5" font-size="16" font-weight="600" text-anchor="middle">X</text>
    
    <circle cx="250" cy="0" r="20" fill="url(#gate-grad)" stroke="#34d399" stroke-width="1.5" filter="url(#neon-glow)" />
    <text x="250" y="6" fill="#ecfdf5" font-size="16" font-weight="600" text-anchor="middle">Z</text>
    
    <rect x="330" y="-20" width="40" height="40" rx="8" fill="url(#gate-grad)" stroke="#34d399" stroke-width="1.5" filter="url(#neon-glow)" />
    <text x="350" y="6" fill="#ecfdf5" font-size="16" font-weight="600" text-anchor="middle">H</text>

    <!-- Checkmark -->
    <g transform="translate(420, 0)">
      <circle cx="0" cy="0" r="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />
      <text x="0" y="5" font-size="16" text-anchor="middle" fill="#10b981" font-weight="bold">✓</text>
    </g>
  </g>


  <!-- MUTATED SECTION -->
  <g transform="translate(100, 280)">
     <text x="-80" y="5" font-size="12" fill="#34d399" font-weight="700" letter-spacing="0.1em">MUTATED</text>

    <!-- Wire -->
    <line x1="0" y1="0" x2="380" y2="0" stroke="#34d399" stroke-width="2" opacity="0.5" />
    
    <!-- Gates -->
    <rect x="50" y="-20" width="40" height="40" rx="8" fill="url(#gate-grad)" stroke="#34d399" stroke-width="1.5" filter="url(#neon-glow)" />
    <text x="70" y="6" fill="#ecfdf5" font-size="16" font-weight="600" text-anchor="middle">H</text>
    
    <!-- Mutated Gate -->
    <rect x="150" y="-20" width="40" height="40" rx="8" fill="url(#warning-grad)" stroke="#fbbf24" stroke-width="2" filter="url(#neon-glow)" />
    <text x="170" y="6" fill="#fffbeb" font-size="16" font-weight="800" text-anchor="middle">Y</text>
    
    <circle cx="250" cy="0" r="20" fill="url(#gate-grad)" stroke="#34d399" stroke-width="1.5" filter="url(#neon-glow)" />
    <text x="250" y="6" fill="#ecfdf5" font-size="16" font-weight="600" text-anchor="middle">Z</text>
    
    <rect x="330" y="-20" width="40" height="40" rx="8" fill="url(#gate-grad)" stroke="#34d399" stroke-width="1.5" filter="url(#neon-glow)" />
    <text x="350" y="6" fill="#ecfdf5" font-size="16" font-weight="600" text-anchor="middle">H</text>

    <!-- X Mark -->
    <g transform="translate(420, 0)">
      <circle cx="0" cy="0" r="16" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="2" />
      <text x="0" y="5" font-size="16" text-anchor="middle" fill="#ef4444" font-weight="bold">✗</text>
    </g>
  </g>
</svg>