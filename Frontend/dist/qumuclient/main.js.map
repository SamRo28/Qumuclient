<div class="container">
  <h1>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    Mutant Information
  </h1>

  <div class="section">
    <div class="row">
      <div class="field">
        <label for="operator">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
            <path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          OPERATOR
        </label>
        <input type="string" id="operator" name="operator" class="input"
          [value]="selectedMutant?.operator?.name || selectedMutant?.mutationOperator" readonly>
      </div>

      <div class="field-small">
        <label for="column">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M6 4v16M12 4v16M18 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          COLUMN
        </label>
        <input type="number" id="column" name="column" min="-1" class="input" [value]="selectedMutant?.mutatedColumn"
          readonly>
      </div>

      <div class="field-small">
        <label for="row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          ROW
        </label>
        <input type="number" id="row" name="row" min="1" class="input" [value]="selectedMutant?.mutatedRow" readonly>
      </div>
    </div>
  </div>
