<h2 class="mutant-title">
  <svg width="24" height="24" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="qubit-glow-emerald" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feFlood flood-color="#10b981" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="glow" />
        <feMerge>
          <feMergeNode in="glow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="qubit-glow-lime" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feFlood flood-color="#84cc16" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="glow" />
        <feMerge>
          <feMergeNode in="glow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    <path d="M35 50 Q 50 35, 65 50" stroke="rgba(16, 185, 129, 0.5)" stroke-width="2" fill="none"
      stroke-linecap="round" />
    <circle cx="35" cy="50" r="8" fill="#10b981" filter="url(#qubit-glow-emerald)" />
    <circle cx="65" cy="50" r="8" fill="#84cc16" filter="url(#qubit-glow-lime)" />
  </svg>
  Mutant {{ manager.selectedMutant?.mutantIndex}}
</h2>

<div class="tabs">
  <button class="tab" [class.active]="selectedTab === 'info'" (click)="selectTab('info')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
      <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    INFO
  </button>
  <button class="tab" [class.active]="selectedTab === 'code'" (click)="selectTab('code')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M16 18l6-6-6-6M8 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
    CODE
  </button>
  <button class="tab" [class.active]="selectedTab === 'visualization'" (click)="selectTab('visualization')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
      <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
    VISUALIZATION
  </button>
</div>

<div *ngIf="selectedTab === 'info'">
  <div class="info-content">
    <app-mutants-general></app-mutants-general>
  </div>
</div>

<div *ngIf="selectedTab === 'code'">
  <div class="code-content">
    <app-mutants-code></app-mutants-code>
  </div>
</div>

<div *ngIf="selectedTab === 'visualization'">
  <div class="visualization-content">
    <app-mutants-visual></app-mutants-visual>
  </div>
</div>
