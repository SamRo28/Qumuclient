<button class="save-button" (click)="onSave()" aria-label="Save">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" />
    <path d="M17 21v-8H7v8M7 3v5h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" />
  </svg>
  <span>Save</span>
</button>

<div *ngIf="isLoginOpen" class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h5 class="modal-title">Login</h5>
      <button type="button" class="close" (click)="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="form-group">
          <label for="username">Usuario/Email:</label>
          <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username"
            placeholder="Ingrese su usuario o email" required #usernameInput="ngModel">
          <div *ngIf="usernameInput.invalid && usernameInput.touched" class="text-danger">
            El usuario o email es requerido
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password"
            placeholder="Ingrese su contraseña" required #passwordInput="ngModel">
          <div *ngIf="passwordInput.invalid && passwordInput.touched" class="text-danger">
            La contraseña es requerida
          </div>
        </div>

        <div class="form-group text-center">
          <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoggingIn">
            <span *ngIf="isLoggingIn" class="spinner-border spinner-border-sm" role="status"></span>
            {{ isLoggingIn ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
          </button>
          <button type="button" class="btn btn-secondary ml-2" (click)="closeModal()" [disabled]="isLoggingIn">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
